name: CI Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'Cargo.lock'
      - '**/requirements.txt'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'Cargo.lock'
      - '**/requirements.txt'
  workflow_dispatch:
    inputs:
      debug_mode:
        description: 'Run with extra logging'
        required: false
        default: 'false'

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  compute-ci:
    name: Rust Compute CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/compute
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src/compute"

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust with Clippy
        run: cargo clippy -- -D warnings

      - name: Build compute module
        run: cargo build --verbose

      - name: Run Rust tests
        run: cargo test --verbose

  analysis-ci:
    name: Python Analysis CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/analysis

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: src/analysis/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint Python with Ruff
        run: ruff check .

      - name: Run Python tests
        run: pytest . || [ $? -eq 5 ]
